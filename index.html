<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Device Node</title>
    <style>
        body { background-color: #000000; color: #ffffff; font-family: sans-serif; text-align: center; padding: 50px; }
        .card { border: 2px solid #333; padding: 20px; border-radius: 10px; display: inline-block; }
        .online { color: #00ff00; font-weight: bold; }
        .offline { color: #ff0000; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Device Status Panel</h2>
        <p>Availability: <span id="network-status" class="online">ONLINE</span></p>
        <p>Power State: <span id="charge-status">Checking...</span></p>
        <p>Battery Level: <span id="battery-level">0%</span></p>
    </div>

    <script>
        const network = document.getElementById('network-status');
        const charge = document.getElementById('charge-status');
        const level = document.getElementById('battery-level');

        // 1. Monitor Network Connection
        window.addEventListener('offline', () => {
            network.innerText = "OFFLINE / UNAVAILABLE";
            network.className = "offline";
        });
        window.addEventListener('online', () => {
            network.innerText = "ONLINE / AVAILABLE";
            network.className = "online";
        });

        // 2. Monitor Physical Battery & Charger
        if ('getBattery' in navigator) {
            navigator.getBattery().then(function(battery) {
                function updateBatteryInfo() {
                    level.innerText = Math.round(battery.level * 100) + "%";
                    charge.innerText = battery.charging ? "CHARGING (On Wall)" : "DISCHARGING (Mobile)";
                    charge.style.color = battery.charging ? "#00ff00" : "#ffaa00";
                }
                
                updateBatteryInfo();
                battery.addEventListener('chargingchange', updateBatteryInfo);
                battery.addEventListener('levelchange', updateBatteryInfo);
            });
        } else {
            charge.innerText = "Battery API Not Supported";
        }
    </script>
</body>
</html>------
